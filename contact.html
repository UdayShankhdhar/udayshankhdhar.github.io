    <meta
        name="description"
        content="Contact Uday Shankhdhar for professional and project-related opportunities."
    >

    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://example.com/contact.html">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a class="skip-link" href="#main-content">
        Skip to main content
    </a>

    <header>
        <nav aria-label="Main navigation">
            <a class="logo" href="index.html">Uday</a>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li>
                    <a href="contact.html" aria-current="page">
                        Contact
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main id="main-content">

        <section aria-labelledby="contact-title">
            <h1 id="contact-title">Contact Me</h1>

            <p>
                Have a question or want to discuss a project?
                Send me a message.
            </p>

            <form action="#" method="post">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required
                        aria-describedby="name-help"
                    >

                    <small id="name-help">
                        Please enter your full name.
                    </small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        aria-describedby="email-help"
                    >

                    <small id="email-help">
                        Enter a valid email address.
                    </small>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>
                </div>

                <button type="submit">
                    Send Message
                </button>

            </form>
        </section>

    </main>

    </footer>

</body>
</html>
